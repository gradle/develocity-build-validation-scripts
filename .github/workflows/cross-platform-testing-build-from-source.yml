name: Run Cross-Platform Tests (Build From Source)

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=solutions.develocity.cloud=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload built script artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts
          path: |
            build/distributions/develocity-gradle-build-validation-*.zip
            build/distributions/develocity-maven-build-validation-*.zip

  cross_platform_tests:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Only the latest available version of each OS is tested
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        # Only LTS versions greater than 8 are tested
        java-version: [ '8', '11', '17', '21' ]
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: macos-15
            shell: bash
          - os: windows-2025
            shell: wsl-bash
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    env:
      WSLENV: GITHUB_ACTIONS:GITHUB_SERVER_URL:GITHUB_REPOSITORY:GITHUB_RUN_ID:GITHUB_WORKFLOW:GITHUB_HEAD_REF:DEVELOCITY_ACCESS_KEY
    steps:
      - name: Set up WSL
        if: ${{ runner.os == 'Windows' }}
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl unzip wget apt-transport-https gnupg
      - name: Set up JDK ${{ matrix.java-version }} on WSL
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -eo pipefail
          curl -fsSL https://repos.azul.com/azul-repo.key | sudo gpg --dearmor -o /usr/share/keyrings/azul.gpg
          echo "deb [signed-by=/usr/share/keyrings/azul.gpg] https://repos.azul.com/zulu/deb stable main" | sudo tee /etc/apt/sources.list.d/zulu.list
          sudo apt-get update
          sudo apt-get install -y zulu${{ matrix.java-version }}-jdk
      - name: Set up JDK ${{ matrix.java-version }}
        if: ${{ runner.os != 'Windows' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: zulu
      - name: Get short-lived Develocity access token
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          oidc_token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc_token"
          token=$(curl -sSf -X POST -H "Authorization: Bearer $oidc_token" \
            "https://solutions.develocity.cloud/api/auth/token?expiresInHours=2")
          echo "::add-mask::$token"
          echo "DEVELOCITY_ACCESS_KEY=solutions.develocity.cloud=$token" >> "$GITHUB_ENV"
      - name: Download built script artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts
      - name: Extract build validation scripts
        run: |
          unzip -o develocity-gradle-build-validation-*.zip
          unzip -o develocity-maven-build-validation-*.zip
      - name: Run Gradle Experiment 01
        working-directory: develocity-gradle-build-validation
        run: ./01-validate-incremental-building.sh -r https://github.com/gradle/gradle-build-scan-quickstart.git -c e7e778e8a00d6ec7e782d7c2a78c4d98e7e4c374 -t build -s https://solutions.develocity.cloud
      - name: Run Gradle Experiment 02
        working-directory: develocity-gradle-build-validation
        run: ./02-validate-local-build-caching-same-location.sh -r https://github.com/gradle/gradle-build-scan-quickstart.git -c e7e778e8a00d6ec7e782d7c2a78c4d98e7e4c374 -t build -s https://solutions.develocity.cloud
      - name: Run Gradle Experiment 03
        working-directory: develocity-gradle-build-validation
        run: ./03-validate-local-build-caching-different-locations.sh -r https://github.com/gradle/gradle-build-scan-quickstart.git -c e7e778e8a00d6ec7e782d7c2a78c4d98e7e4c374 -t build -s https://solutions.develocity.cloud
      - name: Run Gradle Experiment 04
        working-directory: develocity-gradle-build-validation
        run: ./04-validate-remote-build-caching-ci-ci.sh -1 https://solutions.develocity.cloud/s/p4ghldkcscfwi -2 https://solutions.develocity.cloud/s/jhzljnet32x5m
      - name: Run Gradle Experiment 05
        working-directory: develocity-gradle-build-validation
        run: ./05-validate-remote-build-caching-ci-local.sh -1 https://solutions.develocity.cloud/s/dgndhzndrffks -s https://solutions.develocity.cloud -u https://solutions.develocity.cloud/cache/
      - name: Run Maven Experiment 01
        working-directory: develocity-maven-build-validation
        run: ./01-validate-local-build-caching-same-location.sh -r https://github.com/gradle/maven-build-scan-quickstart.git -g test -s https://solutions.develocity.cloud -a '-B'
      - name: Run Maven Experiment 02
        working-directory: develocity-maven-build-validation
        run: ./02-validate-local-build-caching-different-locations.sh -r https://github.com/gradle/maven-build-scan-quickstart.git -g test -s https://solutions.develocity.cloud -a '-B'
      - name: Run Maven Experiment 03
        working-directory: develocity-maven-build-validation
        run: ./03-validate-remote-build-caching-ci-ci.sh -1 https://solutions.develocity.cloud/s/sysk4hrdbkja6 -2 https://solutions.develocity.cloud/s/f7yfwfxqzg5us
      - name: Run Maven Experiment 04
        working-directory: develocity-maven-build-validation
        run: ./04-validate-remote-build-caching-ci-local.sh -1 https://solutions.develocity.cloud/s/4zpdvd2l2ualu -s https://solutions.develocity.cloud -a '-B'
